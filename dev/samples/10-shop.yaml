# An old nginx: plenty of known CVEs, most of them fixed in later Debian packages.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-web
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels: { app: legacy-web }
  template:
    metadata:
      labels: { app: legacy-web }
    spec:
      containers:
        - name: nginx
          image: nginx:1.21.0
          ports: [{ containerPort: 80 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  namespace: shop
spec:
  serviceName: cache
  replicas: 1
  selector:
    matchLabels: { app: cache }
  template:
    metadata:
      labels: { app: cache }
    spec:
      containers:
        - name: redis
          image: redis:6.0.5
